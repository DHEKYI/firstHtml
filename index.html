<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    
    <!-- Link your favicon -->
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    
    <!-- All styling embedded directly into the HTML file -->
    <style>
        /* Base Page Styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #00060f;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Page Title */
        #page-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #d7d11b;
            text-align: center;
        }

        /* Name Input Container Styling */
        .name-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        #name-input {
            padding: 10px 14px;
            border: 1px solid #ccd1d9;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #name-input:focus {
            border-color: #3498db;
        }

        /* Main Pomodoro Card */
        .pomodoro-card {
            background: #655267;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            width: 320px;
        }

        /* Mode Selector Navigation */
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .mode-btn {
            background-color: #e4e8ec;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: #555;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background-color: #3498db;
            color: white;
        }

        /* Timer Display Numbers */
        .timer-display {
            font-size: 4rem;
            font-weight: 700;
            color: #faf3ff;
            margin-bottom: 25px;
            letter-spacing: -2px;
        }

        /* Controls Buttons */
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-start {
            background-color: #2ecc71;
            color: white;
        }

        .btn-start:hover {
            background-color: #27ae60;
        }

        .btn-reset {
            background-color: #e74c3c;
            color: white;
        }

        .btn-reset:hover {
            background-color: #c0392b;
        }

        .btn-name {
            background-color: #3498db;
            color: white;
        }

        .btn-name:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1 id="page-title">Pomodoro Space</h1>

    <!-- Container holding the input and button to set the user name -->
    <div id="name-input-container" class="name-container">
        <input type="text" id="name-input" placeholder="Enter your name" autocomplete="off" />
        <button type="button" id="save-name-btn" class="btn btn-name">Set Name</button>
    </div>

    <main class="pomodoro-card">
        <nav class="mode-selector">
            <button class="mode-btn active" data-time="3000">pomodoro</button>
            <button class="mode-btn" data-time="600">Break</button>
        </nav>
        <div class="timer-display">
            <span id="minutes">50</span>:<span id="seconds">00</span>
        </div>

        <div class="controls">
            <button id="start-btn" class="btn btn-start">Start</button>
            <button id="reset-btn" class="btn btn-reset">Reset</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>

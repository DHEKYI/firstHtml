
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset ="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dhekyi pomotimer</title>
        <link rel="icon" type="image/png" href="favicon.jpg">

        <style>
            *{ 
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            }
            body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
             }
            .page-title {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
             }
            .pomodoro-card {
            background-color: #1e1e1e;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
           }
            .mode-selector {
            display: flex;
            justify-content: space-between;
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 6px;
            margin-bottom: 2rem;
            gap: 4px;
            }
         .mode-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #a0a0a0;
            padding: 10px 8px;
            font-size: 0.85rem;
            font-weight: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            }
            .mode-btn.active {
            background-color: #3b3b3b;
            color: #ffffff;
           }
            .mode-btn:hover {
            color: #ffffff;
           }
            .timer-display {
            font-size: 5.5rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 2rem;
            color: #ffffff;
          }
           .controls {
            display: flex;
            gap: 12px;
          }
            .btn {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: opacity 0.2s ease, transform 0.1s ease;
            }
           .btn-start {
            background-color: #4caf50;
            color: #ffffff;
        }
           .btn-start:hover {
            opacity: 0.9;
        }
            .btn-reset {
            background-color: #f44336;
            color: #ffffff;
        }
           .btn-reset:hover {
            background-color: #444444;
        }
            .btn-reset:hover {
            background-color: #444444;
        }
        </style>

    </head>
    <body>
        <h1 class="page-title">Dhekyi Pomodoro Space</h1>

        <main class="pomodoro-card">
            <nav class="mode-selector">
                <button class="mode-btn active" data-time="3000">pomodoro</button>
                <button class="mode-btn" data-time="600">Break</button>
            </nav>
            <div class="timer-display">
                <span id="minutes">50</span>:<span id="seconds">00</span>
            </div>

            <div class="controls">
                <button id="start-btn" class="btn btn-start">Start</button>
                <button id="reset-btn" class="btn btn-reset">Reset</button>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
